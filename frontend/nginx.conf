server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static frontend
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse proxy to the backend container (resolved by service name on the Docker network)
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
